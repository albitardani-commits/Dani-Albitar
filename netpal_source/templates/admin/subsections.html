{% extends "admin/base.html" %}
{% block admin_content %}
<div class="admin-header">
    <h1>📂 الأقسام الفرعية – {{ section.name_ar }}</h1>
    <a href="{{ url_for('admin_sections') }}" class="btn btn-outline btn-sm">← الأقسام</a>
</div>

<div class="card">
    <h3>إضافة قسم فرعي</h3>
    <form method="POST" action="{{ url_for('admin_subsection_add', section_id=section.id) }}">
        <div class="form-row">
            <div class="form-group"><label>الاسم (عربي)</label><input type="text" name="name_ar" required></div>
            <div class="form-group"><label>الاسم (إنجليزي)</label><input type="text" name="name_en" required></div>
            <div class="form-group"><label>Slug</label><input type="text" name="slug" required></div>
            <div class="form-group"><label>ترتيب</label><input type="number" name="order_idx" value="0"></div>
        </div>
        <button type="submit" class="btn btn-primary">➕ إضافة</button>
    </form>
</div>

{% for sub in section.subsections|sort(attribute='order_idx') %}
<div class="card">
    <form method="POST" action="{{ url_for('admin_subsection_edit', sub_id=sub.id) }}">
        <div class="form-row">
            <div class="form-group"><label>الاسم (عربي)</label><input type="text" name="name_ar" value="{{ sub.name_ar }}" required></div>
            <div class="form-group"><label>الاسم (إنجليزي)</label><input type="text" name="name_en" value="{{ sub.name_en }}" required></div>
            <div class="form-group"><label>Slug</label><input type="text" name="slug" value="{{ sub.slug }}" required></div>
            <div class="form-group"><label>ترتيب</label><input type="number" name="order_idx" value="{{ sub.order_idx }}"></div>
        </div>
        <div style="display:flex;gap:8px">
            <button type="submit" class="btn btn-primary btn-sm">💾 حفظ</button>
            <a href="{{ url_for('admin_subsection_delete', sub_id=sub.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('حذف؟')">🗑 حذف</a>
        </div>
    </form>
</div>
{% endfor %}
{% endblock %}
